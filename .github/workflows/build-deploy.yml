name: Build and deploy

# The pipeline itself lives in vongaisberg/ci-workflows -- shared with every
# other app on sun. What stays here: when to run, and the fact that this app
# has no dev overlay in sun-gitops for a branch to deploy into.
#
# The build speed is *not* here either: it comes from the cache mounts in this
# repo's Dockerfile, which no shared workflow can supply.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: vongaisberg/ci-workflows/.github/workflows/build-deploy.yml@main
    with:
      image: barbeleuchtung
    secrets: inherit
