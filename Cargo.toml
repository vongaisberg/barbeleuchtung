[package]
name = "barbeleuchtung"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
actix-ws = "0.3.1"
artnet_protocol = "0.4.4"
base64 = "0.22.1"
chrono = "0.4.43"
env_logger = "0.11.9"
log = "0.4.29"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
