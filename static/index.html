<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Barbeleuchtung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Barbeleuchtung</h1>
      <button id="blackout-btn" class="blackout-btn" aria-label="Blackout">
        BLACKOUT
      </button>
    </header>

    <section class="section">
      <h2>Scenes</h2>
      <div id="theme-grid" class="theme-grid">
        <!-- Theme buttons injected by JS -->
      </div>
    </section>

    <section class="section">
      <h2>Effects</h2>
      <div id="fx-theme-grid" class="theme-grid">
        <!-- FX theme buttons injected by JS -->
      </div>
    </section>

    <section class="section">
      <h2>Reactive <span id="reactive-status" class="reactive-status">listening…</span></h2>

      <div class="reactive-auto-block">
        <button id="reactive-auto-btn" class="theme-btn" type="button">Auto</button>
        <div class="reactive-auto-controls">
          <div class="lock-row" id="tier-lock-row">
            <span class="lock-label">Look</span>
            <span id="live-look-badge" class="live-badge" hidden></span>
          </div>
          <div class="lock-row" id="palette-lock-row">
            <span class="lock-label">Palette</span>
            <span id="live-palette-badge" class="live-badge" hidden></span>
          </div>
          <div class="reactive-settings reactive-settings-inline">
            <label class="setting" title="Overall reactive bank brightness">
              <span>Brightness</span>
              <input type="range" class="reactive-slider" id="set-master" min="0" max="1" step="0.01" value="1">
            </label>
            <label class="setting" title="How strongly audio drives the show">
              <span>Sensitivity</span>
              <input type="range" class="reactive-slider" id="set-sensitivity" min="0.3" max="2.5" step="0.05" value="1">
            </label>
            <label class="setting" title="White strobe / blinder amount (0 = off)">
              <span>Strobe</span>
              <input type="range" class="reactive-slider" id="set-strobe" min="0" max="1" step="0.01" value="1">
            </label>
          </div>
        </div>
      </div>

      <div id="audio-meter" class="audio-meter">
        <div class="meter-row">
          <span class="meter-label">BPM</span>
          <span id="meter-bpm" class="meter-value">—</span>
          <span class="meter-label">beat</span>
          <span id="meter-beat" class="meter-beat">●</span>
          <span class="meter-label">groove</span>
          <span id="meter-groove" class="meter-drop groove">4/4</span>
        </div>
        <div class="meter-row">
          <span class="meter-label">energy</span>
          <span id="meter-energy" class="meter-value">0</span>
          <span class="meter-label">intensity</span>
          <span id="meter-intensity" class="meter-value">0</span>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Spotify</h2>
      <div id="spotify-panel" class="spotify-panel">
        <div id="now-playing" class="now-playing">
          <span class="now-playing-label">Now playing</span>
          <span id="now-playing-track" class="now-playing-track">—</span>
        </div>
        <a id="spotify-connect" class="spotify-connect" href="spotify/login" hidden>
          Connect Spotify
        </a>
      </div>
    </section>

    <section class="section">
      <h2>Faders</h2>
      <div id="fader-row" class="fader-row">
        <!-- Faders injected by JS -->
      </div>
    </section>

    <section class="section">
      <h2>Fog Machine</h2>
      <button id="fog-btn" class="fog-btn" aria-label="Fog Machine Toggle">
        FOG: OFF
      </button>
      <div class="fog-settings">
        <span class="fog-label">Interval</span>
        <input type="range" id="fog-interval" class="fog-slider"
               min="1" max="30" step="0.5" value="1" />
        <span class="fog-value" id="fog-interval-val">1 min</span>

        <span class="fog-label">Duration</span>
        <input type="range" id="fog-duration" class="fog-slider"
               min="5" max="25" step="1" value="5" />
        <span class="fog-value" id="fog-duration-val">5 s</span>

        <span class="fog-label">Level</span>
        <input type="range" id="fog-level" class="fog-slider"
               min="1" max="30" step="1" value="5" />
        <span class="fog-value" id="fog-level-val">5 %</span>
      </div>
    </section>

    <div id="status-bar" class="status-bar">
      <span id="status-bar-conn" class="status-bar-conn">Connecting…</span>
      <span class="universe-pills-label">Mute Universes</span>
      <span id="universe-pills" class="universe-pills" aria-label="DMX universe output"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
