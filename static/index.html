<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Barbeleuchtung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Barbeleuchtung</h1>
      <button id="blackout-btn" class="blackout-btn" aria-label="Blackout">
        BLACKOUT
      </button>
    </header>

    <section class="section">
      <h2>Scenes</h2>
      <div id="theme-grid" class="theme-grid">
        <!-- Theme buttons injected by JS -->
      </div>
    </section>

    <section class="section">
      <h2>Effects</h2>
      <div id="fx-theme-grid" class="theme-grid">
        <!-- FX theme buttons injected by JS -->
      </div>
    </section>

    <section class="section">
      <h2>Faders</h2>
      <div id="fader-row" class="fader-row">
        <!-- Faders injected by JS -->
      </div>
    </section>

    <section class="section">
      <h2>Fog Machine</h2>
      <button id="fog-btn" class="fog-btn" aria-label="Fog Machine Toggle">
        FOG: OFF
      </button>
      <div class="fog-settings">
        <span class="fog-label">Interval</span>
        <input type="range" id="fog-interval" class="fog-slider"
               min="1" max="30" step="0.5" value="5" />
        <span class="fog-value" id="fog-interval-val">5 min</span>

        <span class="fog-label">Duration</span>
        <input type="range" id="fog-duration" class="fog-slider"
               min="5" max="25" step="1" value="5" />
        <span class="fog-value" id="fog-duration-val">5 s</span>

        <span class="fog-label">Level</span>
        <input type="range" id="fog-level" class="fog-slider"
               min="20" max="70" step="5" value="50" />
        <span class="fog-value" id="fog-level-val">80 %</span>
      </div>
    </section>

    <div id="status-bar" class="status-bar">Connecting…</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
